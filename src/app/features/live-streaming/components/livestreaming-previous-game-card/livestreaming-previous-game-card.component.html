<mat-card class="example-card" [routerLink]="['/watch', game?.gameId || game?.id || 1]">
    <mat-card-content>
      <!-- First Row of Data -->
      <div class="data-row">
        <div class="column">
          <h2>{{ game?.homeScore ?? '-' }}</h2>
        </div>
        <div class="column">
          <h2>{{ game?.awayScore ?? '-' }}</h2>
        </div>
      </div>
      <!-- Second Row of Data -->
      <div class="data-row second-row">
        <div class="column">
          <div class="profile-image-container">
            <img [src]="game?.imageHome || 'assets/images/stow_vs_northRoyalton_example.jpg'" class="profile-image">
          </div>
        </div>
        <div class="column">
          <h3>{{ game?.quarter ?? 'Final' }}</h3>
        </div>
        <div class="column">
          <div class="profile-image-container">
            <img [src]="game?.imageAway || 'assets/images/stow_vs_northRoyalton_example.jpg'" class="profile-image">
          </div>
        </div>
      </div>
      <!-- Third Row of Data -->
      <div class="data-row third-row">
        <div class="column">
          <span id="teamNames">{{ game?.homeTeam ?? 'Home' }}</span>
        </div>
        <div class="column">
          <span id="teamNames">{{ game?.awayTeam ?? 'Away' }}</span>
        </div>
      </div>
    </mat-card-content>
    <button class="watch-game-btn" [routerLink]="['/watch', game?.gameId || game?.id || 1]">Watch Now</button>
  </mat-card>
