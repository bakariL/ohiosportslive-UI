<section class="edit-profile">
  <div class="header">
    <h1>Edit profile</h1>
    <p>Update your account details.</p>
  </div>

  <div class="form-card">
    <label>
      Full name
      <input type="text" [(ngModel)]="profile.name" />
    </label>
    <label>
      Email
      <input type="email" [(ngModel)]="profile.email" />
    </label>
    <label>
      Phone
      <input type="text" [(ngModel)]="profile.phone" />
    </label>
    <label>
      Location
      <input type="text" [(ngModel)]="profile.location" />
    </label>
    <label>
      Bio
      <textarea rows="4" [(ngModel)]="profile.bio"></textarea>
    </label>

    <div class="actions">
      <button class="btn ghost" (click)="cancel()">Cancel</button>
      <button class="btn primary" (click)="save()">Save changes</button>
    </div>
  </div>
</section>
