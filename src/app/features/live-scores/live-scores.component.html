<section class="live-scores-section">
  <div class="top-row">
    <div class="top-row-left">
      <img src="assets/images/livescore-section-homePg/livescore-header-img.png" alt="Live Scores" class="top-left-img">
      <div class="top-row-text">
        <span class="title-livescore">LiveScores</span>
        <span class="subtitle-livescore">Between its the self-interest, where her of bed it the there throughout long.</span>
      </div>
    </div>
    <button class="viallAllBtn" *ngIf="showViewAll" [routerLink]="['/live-games']">View All</button>
  </div>
  <div class="bottom-row">
    <mat-card class="example-card" *ngFor="let game of games" [routerLink]="['/watch', game.gameId]">
      <mat-card-content>
        <div class="data-row">
          <div class="column">
            <h2>{{ game.homeScore }}</h2>
          </div>
          <div class="column">
            <h2>{{ game.awayScore }}</h2>
          </div>
        </div>
        <div class="data-row second-row">
          <div class="column">
            <img src="path/to/your/image1.jpg" class="centered-image">
          </div>
          <div class="column">
            <h3>{{ game.quarter }}</h3>
          </div>
          <div class="column">
            <img src="path/to/your/image2.jpg" class="centered-image">
          </div>
        </div>
        <div class="data-row third-row">
          <div class="column">
            <span id="teamNames">{{ game.homeTeam }}</span>
          </div>
          <div class="column">
            <span id="teamNames">{{ game.awayTeam }}</span>
          </div>
        </div>
      </mat-card-content>
      <button class="view-game-btn" [routerLink]="['/watch', game.gameId]">View Game</button>
    </mat-card>
  </div>
</section>
