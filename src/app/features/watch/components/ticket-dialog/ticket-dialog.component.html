<div class="ticket-dialog">
  <div class="ticket-breadcrumbs">Home / Watch / Buy Ticket</div>
  <div class="ticket-header">
    <h3>Buy Ticket</h3>
    <button class="close-btn" type="button" (click)="close()">×</button>
  </div>

  <div class="ticket-content">
    <h4>{{ data.title }}</h4>
    <p>{{ data.meta }}</p>
    <div class="price">{{ data.price }}</div>
    <div class="promo-field">
      <label for="promoCode">Promo code (optional)</label>
      <input id="promoCode" type="text" placeholder="Enter code" />
    </div>
  </div>

  <button class="pay-btn" type="button" (click)="payNow()">Pay Now</button>
</div>
