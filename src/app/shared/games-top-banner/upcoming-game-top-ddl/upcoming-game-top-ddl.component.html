<mat-card class="custom-card">
  <mat-card-title class="card-title">Upcoming Games</mat-card-title>

  <div class="card-content">
    <div class="select-wrap" [class.open]="isOpen">
      <button class="select-trigger" type="button" (click)="toggleOpen()">
        <span class="select-label">{{ selectedLabel }}</span>
        <span class="select-chevron"></span>
      </button>

      <ul class="select-panel" *ngIf="isOpen">
        <li
          class="select-option"
          *ngFor="let option of options"
          (click)="selectOption(option)"
        >
          {{ option.label }}
        </li>
      </ul>
    </div>
  </div>
</mat-card>
