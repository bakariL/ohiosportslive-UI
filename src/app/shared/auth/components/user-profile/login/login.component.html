<section class="auth-screen">
  <div class="auth-card">
    <h1>Sign In or Sign Up</h1>
    <div class="auth-social">
      <button type="button" class="social-btn">
        <i class="fab fa-google"></i>
        Sign in with Google
      </button>
      <button type="button" class="social-btn">
        <i class="fab fa-twitter"></i>
        Sign in with Twitter
      </button>
    </div>

    <div class="divider"><span>Use my account</span></div>

    <form [formGroup]="form" (submit)="login()" class="auth-form">
      <input
        formControlName="Email_Address"
        type="email"
        placeholder="Email Address"
        required
      />
      <input
        formControlName="Password"
        type="password"
        placeholder="Password"
        required
      />
      <button class="primary-btn" type="submit">Login</button>
    </form>

    <button class="secondary-btn" type="button" [routerLink]="['/auth/signup']">Sign Up</button>

    <p class="auth-footer">
      Don't have an account?
      <a [routerLink]="['/auth/signup']">Sign Up</a>
    </p>
  </div>
</section>
